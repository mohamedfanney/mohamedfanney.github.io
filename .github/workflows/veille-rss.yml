name: Veille Wazuh – recherche et suivi

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veille-rss.yml'
      - 'scripts/maj_veille.py'

permissions:
  contents: write

concurrency:
  group: veille-wazuh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collecter les sources Wazuh et CERT-FR
        run: python3 scripts/maj_veille.py
      - name: Publier le tableau de veille
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille-wazuh.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les publications de veille Wazuh"
            git push
          fi
