name: Actualiser les flux RSS du portfolio

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/veille-rss.yml'
      - 'scripts/maj_veille.py'

permissions:
  contents: write

concurrency:
  group: portfolio-veille-rss
  cancel-in-progress: false

jobs:
  maj-veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Générer les articles à partir des RSS
        run: python3 scripts/maj_veille.py
      - name: Publier les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille-rss.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser la veille RSS"
            git push
          fi
